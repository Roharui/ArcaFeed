name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_TAG="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${PACKAGE_TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match ${PACKAGE_TAG}." >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/main; then
            echo "Release tag must point to a commit on origin/main." >&2
            exit 1
          fi

      - name: Install and verify
        run: |
          npm ci
          npm run check

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ArcaFeed.user.js
          fail_on_unmatched_files: true
          generate_release_notes: true
