name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            ArcaFeed/package-lock.json
            RuliFeed/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload userscript artifacts
        uses: actions/upload-artifact@v4
        with:
          name: userscripts
          path: |
            dist/ArcaFeed.user.js
            dist/RuliFeed.user.js
